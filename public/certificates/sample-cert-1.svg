<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>
  
  <!-- Border -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#10b981" stroke-width="4"/>
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#10b981" stroke-width="2"/>
  
  <!-- Header -->
  <text x="600" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#059669" text-anchor="middle">
    CERTIFICATE OF COMPLETION
  </text>
  
  <!-- Decorative line -->
  <line x1="300" y1="150" x2="900" y2="150" stroke="#10b981" stroke-width="2"/>
  
  <!-- Main content -->
  <text x="600" y="220" font-family="Arial, sans-serif" font-size="24" fill="#374151" text-anchor="middle">
    This certifies that
  </text>
  
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#111827" text-anchor="middle">
    John Developer
  </text>
  
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="24" fill="#374151" text-anchor="middle">
    has successfully completed
  </text>
  
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#059669" text-anchor="middle">
    AWS Certified Cloud Practitioner
  </text>
  
  <!-- Details -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">
    Issued by Amazon Web Services
  </text>
  
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Date: January 15, 2024
  </text>
  
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">
    Credential ID: AWS-CCP-2024-001
  </text>
  
  <!-- Logo placeholder -->
  <circle cx="200" cy="680" r="50" fill="#10b981" opacity="0.2"/>
  <text x="200" y="690" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#059669" text-anchor="middle">
    AWS
  </text>
  
  <!-- Signature line -->
  <line x1="750" y1="680" x2="1000" y2="680" stroke="#374151" stroke-width="2"/>
  <text x="875" y="710" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">
    Authorized Signature
  </text>
  
  <!-- Sample watermark -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="120" fill="#10b981" opacity="0.05" text-anchor="middle" transform="rotate(-30 600 400)">
    SAMPLE
  </text>
</svg>
