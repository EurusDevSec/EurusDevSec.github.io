# EurusDevSec Blog — Vercel Deploy Workflow
# Vercel tự động deploy khi push lên main — file này CHỈ để CI checks
# (build test, type check) chứ KHÔNG cần workflow deploy riêng.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
